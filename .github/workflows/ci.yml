---
name: DevSecOps Pipeline

on:
  push:
    branches: ["main", "vulnerable"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: flask-api
  IMAGE_TAG: ${{ github.sha }}
  CONFTEST_VERSION: "0.71.1"

# Les actions tierces sont épinglées par SHA de commit (le tag est en commentaire) :
# un tag peut être déplacé vers du code malveillant, pas un SHA. Dependabot les met à jour.
jobs:
  # JOB 1 : Lint YAML
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lint des manifestes et du workflow
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml k8s/ .github/

  # JOB 2 : Tests de l'API
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  # JOB 3 : Build de l'image Docker
  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [lint-yaml, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
          docker save "$IMAGE_NAME:$IMAGE_TAG" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # JOB 4 : Scan du dépôt (dépendances, secrets, mauvaises configurations)
  trivy-fs:
    name: Trivy - dépôt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Rapport complet (informatif)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: "0"
      - name: Rapport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Envoi vers l'onglet Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      # La barrière : le job échoue s'il reste une faille CRITICAL ou HIGH qui a un correctif
      - name: Barrière de sécurité
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # JOB 5 : Scan de l'image construite
  trivy-image:
    name: Trivy - image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docker-image
      - run: docker load -i image.tar
      - name: Rapport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - name: Envoi vers l'onglet Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Barrière de sécurité
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # JOB 6 : Politiques Kubernetes (Conftest / Rego)
  conftest:
    name: Conftest - politiques Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Installer Conftest (somme de contrôle vérifiée)
        run: |
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          file="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfLO "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar xzf "$file" conftest
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: Tests unitaires des politiques
        run: conftest verify --policy policy/
      - name: Vérification des manifestes
        run: conftest test k8s/ --policy policy/

  # JOB 7 : Résumé
  security-summary:
    name: Résumé
    runs-on: ubuntu-latest
    needs: [lint-yaml, tests, build, trivy-fs, trivy-image, conftest]
    if: always()
    steps:
      - name: Résumé du pipeline
        run: |
          {
            echo "## Résumé du pipeline DevSecOps"
            echo ""
            echo "| Étape | Statut |"
            echo "|-------|--------|"
            echo "| Lint YAML | ${{ needs.lint-yaml.result }} |"
            echo "| Tests | ${{ needs.tests.result }} |"
            echo "| Build Docker | ${{ needs.build.result }} |"
            echo "| Trivy dépôt | ${{ needs.trivy-fs.result }} |"
            echo "| Trivy image | ${{ needs.trivy-image.result }} |"
            echo "| Conftest | ${{ needs.conftest.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
